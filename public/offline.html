<!doctype html>
<!--
  Shown by the service worker (public/sw.js) when a page is opened without a connection and was
  never visited before. It must work with no network at all, so it is plain HTML with inline styles
  and both languages on one page (see docs/adr/0005-pwa-without-a-library.md).
-->
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b0b0e" />
    <title>Нет соединения | Deep Semantic</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(620px 440px at 15% 20%, rgb(255 176 90 / 0.11), transparent 70%),
          radial-gradient(720px 520px at 85% 70%, rgb(120 172 228 / 0.09), transparent 70%), #0b0b0e;
        color: #dedbd4;
        font-family: Georgia, "Times New Roman", serif;
        text-align: center;
      }
      main {
        max-width: 34rem;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
      }
      h1 {
        margin: 24px 0 8px;
        font-size: clamp(1.6rem, 6vw, 2.4rem);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #e2c46c;
      }
      p {
        margin: 0 0 12px;
        line-height: 1.6;
        color: #b4b4b8;
        font-family: system-ui, sans-serif;
      }
      hr {
        width: min(320px, 70%);
        height: 3px;
        margin: 28px auto;
        border: 0;
        border-radius: 3px;
        background: linear-gradient(
          90deg,
          transparent,
          #5f8fb0 14%,
          #bcdcf0 50%,
          #5f8fb0 86%,
          transparent
        );
      }
      a {
        display: inline-block;
        margin-top: 8px;
        padding: 12px 28px;
        border: 1px solid #d4af37;
        border-radius: 8px;
        color: #0a0a0c;
        background: linear-gradient(135deg, #d4af37, #b8952a);
        font-family: ui-monospace, Consolas, monospace;
        font-size: 13px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid #e8d48b;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Нет соединения</h1>
      <p>
        Эта страница ещё не сохранена на устройстве. Страницы, которые вы уже открывали, доступны и
        без интернета.
      </p>
      <a href="/">Попробовать снова</a>
      <hr />
      <h1 lang="en">You are offline</h1>
      <p lang="en">
        This page has not been saved on your device yet. Pages you have already opened work without
        a connection.
      </p>
      <a href="/" lang="en">Try again</a>
    </main>
  </body>
</html>
